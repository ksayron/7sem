name: coffee_lab8
description: 'Лабораторная 8. Hive, роли и избранное.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  hive: 2.2.3
  crypto: ^3.0.8
  path_provider: ^2.1.6

# Match the installed Flutter/Android toolchain; 2.3.x adds a JNI toolchain
# requiring a separate Android 35 SDK, absent from this workstation.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/iced_coffee.png
    - assets/images/coffee_cup.png
    - assets/images/espresso.png


