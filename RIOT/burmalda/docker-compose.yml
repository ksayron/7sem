# Minimal Burmalda. Historical labs: docker compose -f docker-compose.legacy.yml ...
name: burmalda-core
services:
  postgres:
    image: burmalda-postgres:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-burmalda_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-burmalda_admin_dev}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev}
      LENDING_DB_PASSWORD: ${LENDING_DB_PASSWORD:-lending_dev}
      ECONOMY_DB_PASSWORD: ${ECONOMY_DB_PASSWORD:-economy_dev}
      REPUTATION_DB_PASSWORD: ${REPUTATION_DB_PASSWORD:-reputation_dev}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      POSTGRES_DB: postgres
      PROVISION_LEARNING_LABS: 'false'
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5547}:5432
    volumes:
    - core-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
    - burmalda
    cpus: '1.0'
    mem_limit: 1g
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-burmalda}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-burmalda_dev}
    ports:
    - 127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672
    - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
    - core-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
    - burmalda
    cpus: '1.0'
    mem_limit: 768m
  identity:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-identity:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Services/Identity/Burmalda.Identity.Api
        ASSEMBLY_NAME: Burmalda.Identity.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=identity_db;Username=identity_app;Password=${IDENTITY_DB_PASSWORD:-identity_dev};Timeout=3;Command
        Timeout=15
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@burmalda.local}
      AdminSeed__Password: ${ADMIN_PASSWORD:-ChangeMe123!}
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
    ports:
    - 127.0.0.1:5101:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: '1.0'
    mem_limit: 512m
  catalog:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-catalog:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Services/Catalog/Burmalda.Catalog.Api
        ASSEMBLY_NAME: Burmalda.Catalog.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=catalog_db;Username=catalog_app;Password=${CATALOG_DB_PASSWORD:-catalog_dev};Timeout=3;Command
        Timeout=15
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
      APP_MODE: compose
    ports:
    - 127.0.0.1:5102:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: '1.0'
    mem_limit: 512m
  lending:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-lending:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Services/Lending/Burmalda.Lending.Api
        ASSEMBLY_NAME: Burmalda.Lending.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=lending_db;Username=lending_app;Password=${LENDING_DB_PASSWORD:-lending_dev};Timeout=3;Command
        Timeout=15
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
    ports:
    - 127.0.0.1:5103:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: '1.0'
    mem_limit: 512m
  economy:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-economy:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Services/Economy/Burmalda.Economy.Api
        ASSEMBLY_NAME: Burmalda.Economy.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=economy_db;Username=economy_app;Password=${ECONOMY_DB_PASSWORD:-economy_dev};Timeout=3;Command
        Timeout=15
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
    ports:
    - 127.0.0.1:5104:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: '1.0'
    mem_limit: 512m
  reputation:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-reputation:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Services/Reputation/Burmalda.Reputation.Api
        ASSEMBLY_NAME: Burmalda.Reputation.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=reputation_db;Username=reputation_app;Password=${REPUTATION_DB_PASSWORD:-reputation_dev};Timeout=3;Command
        Timeout=15
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
    ports:
    - 127.0.0.1:5105:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: '1.0'
    mem_limit: 512m
  notifications:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-notifications:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Services/Notifications/Burmalda.Notifications.Api
        ASSEMBLY_NAME: Burmalda.Notifications.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=notification_db;Username=notification_app;Password=${NOTIFICATION_DB_PASSWORD:-notification_dev};Timeout=3;Command
        Timeout=15
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
    ports:
    - 127.0.0.1:5106:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: '1.0'
    mem_limit: 512m
  gateway:
    restart: unless-stopped
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    image: burmalda-gateway:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        PROJECT_PATH: src/Gateway/Burmalda.Gateway
        ASSEMBLY_NAME: Burmalda.Gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-burmalda}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-burmalda_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-32-chars}
      ClientOrigins__0: http://localhost:5300
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080
      ServiceUrls__identity: http://identity:8080
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: http://catalog:8080
      ServiceUrls__catalog: http://catalog:8080
      ReverseProxy__Clusters__lending__Destinations__primary__Address: http://lending:8080
      ServiceUrls__lending: http://lending:8080
      ReverseProxy__Clusters__economy__Destinations__primary__Address: http://economy:8080
      ServiceUrls__economy: http://economy:8080
      ReverseProxy__Clusters__reputation__Destinations__primary__Address: http://reputation:8080
      ServiceUrls__reputation: http://reputation:8080
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: http://notifications:8080
      ServiceUrls__notifications: http://notifications:8080
      Telemetry__Enabled: 'false'
      Features__LearningLabs: 'false'
    ports:
    - 127.0.0.1:5000:8080
    cpus: '1.0'
    mem_limit: 512m
  web:
    restart: unless-stopped
    image: burmalda-web:${BURMALDA_IMAGE_TAG:-lr9}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        PROJECT_PATH: src/Clients/Burmalda.Web
        ASSEMBLY_NAME: Burmalda.Web
    ports:
    - 127.0.0.1:5300:8080
    networks:
    - burmalda
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      LEARNING_LABS: 'false'
    cpus: '0.25'
    mem_limit: 128m
volumes:
  core-postgres-data: {}
  core-rabbitmq-data: {}
networks:
  burmalda: {}
