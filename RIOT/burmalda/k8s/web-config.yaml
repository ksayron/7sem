apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        include /etc/nginx/mime.types;
        location /api/ {
            resolver kube-dns.kube-system.svc.cluster.local valid=5s;
            set $gateway http://gateway.burmalda.svc.cluster.local:8080;
            proxy_pass $gateway;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 502 503 504 = @unavailable;
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"message":"Сервис временно недоступен. Повторите запрос после восстановления."}';
        }
        location = /appsettings.json { add_header Cache-Control "no-store"; }
        location / { try_files $uri $uri/ /index.html; }
    }
