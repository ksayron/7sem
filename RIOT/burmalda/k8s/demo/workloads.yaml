apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-control-data
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-control
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-control
  template:
    metadata:
      labels:
        app: demo-control
        app.kubernetes.io/part-of: burmalda
        burmalda.demo/managed: 'true'
    spec:
      containers:
      - name: demo-control
        image: burmalda-demo-control:lr9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        env:
        - name: ASPNETCORE_URLS
          value: http://0.0.0.0:8080
        - name: Demo__DataPath
          value: /data
        - name: Demo__GatewayUrl
          value: http://gateway:8080
        - name: Demo__PrometheusUrl
          value: http://prometheus:9090
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: JWT_SIGNING_KEY
        - name: Demo__FixturePassword
          valueFrom:
            secretKeyRef:
              name: burmalda-demo-secrets
              key: FIXTURE_PASSWORD
        - name: Demo__ControlKey
          valueFrom:
            secretKeyRef:
              name: burmalda-demo-secrets
              key: CONTROL_KEY
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://prometheus:9090/api/v1/otlp
        - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
          value: http/protobuf
        - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
          value: http://prometheus:9090/api/v1/otlp/v1/metrics
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: '5000'
        - name: Logging__LogLevel__Microsoft
          value: Warning
        - name: TZ
          value: Europe/Minsk
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: demo-control-data
      serviceAccountName: demo-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: burmalda
        burmalda.demo/managed: 'true'
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        - --storage.tsdb.retention.size=1GB
        - --web.enable-otlp-receiver
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
        app.kubernetes.io/part-of: burmalda
        burmalda.demo/managed: 'true'
    spec:
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: telemetry
          containerPort: 8081
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        args:
        - --namespaces=burmalda
        - --resources=pods,deployments,horizontalpodautoscalers
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      serviceAccountName: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: burmalda
        burmalda.demo/managed: 'true'
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: burmalda-demo-secrets
              key: GRAFANA_PASSWORD
        - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
          value: 5s
        volumeMounts:
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
          subPath: datasource.yaml
        - name: provisioning
          mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
          subPath: provider.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: provisioning
        configMap:
          name: grafana-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
