---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
spec:
  selector:
    app: grafana
  ports:
  - name: http
