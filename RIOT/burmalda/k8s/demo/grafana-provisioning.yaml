apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      editable: false
      isDefault: true
      name: Burmalda Prometheus
      type: prometheus
      uid: burmalda-prom
      url: http://prometheus:9090
  provider.yaml: |
    apiVersion: 1
    providers:
    - allowUiUpdates: false
      disableDeletion: true
      name: Burmalda
      options:
        path: /var/lib/grafana/dashboards
      type: file
