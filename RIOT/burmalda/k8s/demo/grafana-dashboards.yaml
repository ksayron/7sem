apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
    burmalda.demo/managed: 'true'
data:
  burmalda-demo.json: |-
    {
      "uid": "burmalda-demo",
      "title": "Burmalda · Нагрузка и восстановление",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "burmalda",
        "demo"
      ],
      "timezone": "browser",
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Виртуальные клиенты · задано / активно",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by(kind)(burmalda_demo_clients)",
              "legendFormat": "{{kind}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP симулятора · успешный / весь RPS",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(burmalda_demo_requests_total{operation!=\"prepare\",outcome=\"success\"}[30s]))",
              "legendFormat": "успешные",
              "refId": "A"
            },
            {
              "expr": "sum(rate(burmalda_demo_requests_total{operation!=\"prepare\"}[30s]))",
              "legendFormat": "все",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Время ответа p50 / p95 / p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by(le)(rate(burmalda_demo_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by(le)(rate(burmalda_demo_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by(le)(rate(burmalda_demo_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Ошибки HTTP · отдельно от бизнес-результата",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by(outcome)(rate(burmalda_demo_requests_total{outcome!=\"success\",operation!=\"prepare\"}[30s]))",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "HPA · желаемые / готовые реплики",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"burmalda\"}",
              "legendFormat": "{{horizontalpodautoscaler}} желаемые",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"burmalda\",deployment=~\"catalog|gateway\"}",
              "legendFormat": "{{deployment}} Ready",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "CPU Pod · millicores",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"burmalda\",container!=\"\",container!=\"POD\"}[30s])) * 1000) or (sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"burmalda\",container=\"\",pod!=\"\"}[30s])) * 1000)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "title": "Память Pod · working set",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum by(pod)(container_memory_working_set_bytes{namespace=\"burmalda\",container!=\"\",container!=\"POD\"})) or (sum by(pod)(container_memory_working_set_bytes{namespace=\"burmalda\",container=\"\",pod!=\"\"}))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "title": "HTTP сервисов · реальный трафик по Pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by(job,k8s_pod_name)(rate(http_server_request_duration_seconds_count{http_route!~\"/health/.*\"}[30s]))",
              "legendFormat": "{{job}} · {{k8s_pod_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "title": "Состояние Pod и перезапуски",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "kube_pod_status_ready{namespace=\"burmalda\",condition=\"true\"}",
              "legendFormat": "{{pod}} Ready",
              "refId": "A"
            },
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=\"burmalda\"}",
              "legendFormat": "{{pod}} перезапуски",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "title": "Сбои API и операции",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "burmalda_demo_fault_active",
              "legendFormat": "{{service}} сбой активен",
              "refId": "A"
            },
            {
              "expr": "sum by(outcome)(rate(burmalda_demo_operations_total[30s]))",
              "legendFormat": "{{outcome}} операций/с",
              "refId": "B"
            },
            {
              "expr": "burmalda_demo_pending_operations",
              "legendFormat": "незавершённые операции",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "title": "События · фазы, удаление Pod, сбои",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by(event)(increase(burmalda_demo_events_total[30s]))",
              "legendFormat": "{{event}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "title": "Ошибки запросов, % · цель < 1%",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "100 * sum(rate(burmalda_demo_requests_total{operation!=\"prepare\",outcome!=\"success\"}[30s])) / clamp_min(sum(rate(burmalda_demo_requests_total{operation!=\"prepare\"}[30s])),0.001)",
              "legendFormat": "ошибок, %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "title": "HPA · состояния",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_condition{namespace=\"burmalda\"}",
              "legendFormat": "{{horizontalpodautoscaler}} {{condition}} {{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "title": "Симулятор · CPU",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 12,
            "y": 48,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum(rate(container_cpu_usage_seconds_total{namespace=\"burmalda\",pod=~\"demo-control-.*\",container!=\"\",container!=\"POD\"}[30s])) * 1000) or (sum(rate(container_cpu_usage_seconds_total{namespace=\"burmalda\",pod=~\"demo-control-.*\",container=\"\",pod!=\"\"}[30s])) * 1000)",
              "legendFormat": "DemoControl CPU",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 15,
          "title": "Симулятор · память",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "burmalda-prom"
          },
          "gridPos": {
            "x": 0,
            "y": 56,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum(container_memory_working_set_bytes{namespace=\"burmalda\",pod=~\"demo-control-.*\",container!=\"\",container!=\"POD\"})) or (sum(container_memory_working_set_bytes{namespace=\"burmalda\",pod=~\"demo-control-.*\",container=\"\",pod!=\"\"}))",
              "legendFormat": "DemoControl RAM",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ],
      "annotations": {
        "list": [
          {
            "name": "Фазы и сбои Burmalda",
            "enable": true,
            "datasource": {
              "type": "prometheus",
              "uid": "burmalda-prom"
            },
            "expr": "sum by(event)(increase(burmalda_demo_events_total[15s])) > 0",
            "step": "5s",
            "titleFormat": "{{event}}",
            "tagKeys": "event",
            "iconColor": "#d59b38"
          }
        ]
      }
    }
