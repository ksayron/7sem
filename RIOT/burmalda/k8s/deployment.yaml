apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
        app.kubernetes.io/part-of: burmalda
    spec:
      containers:
      - name: identity
        image: burmalda-identity:lr9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: burmalda-config
        env:
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: JWT_SIGNING_KEY
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: RABBITMQ_PASSWORD
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: IDENTITY_DB_PASSWORD
        - name: ConnectionStrings__Database
          value: Host=postgres;Port=5432;Database=identity_db;Username=identity_app;Password=$(DB_PASSWORD);Timeout=3;Command
            Timeout=15
        - name: AdminSeed__Email
          value: admin@burmalda.local
        - name: AdminSeed__Password
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: ADMIN_PASSWORD
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
