apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: burmalda
    spec:
      containers:
      - name: gateway
        image: burmalda-gateway:lr9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: burmalda-config
        env:
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: JWT_SIGNING_KEY
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: burmalda-secrets
              key: RABBITMQ_PASSWORD
        - name: ClientOrigins__0
          value: http://localhost:5300
        - name: ReverseProxy__Clusters__identity__Destinations__primary__Address
          value: http://identity:8080
        - name: ServiceUrls__identity
          value: http://identity:8080
        - name: ReverseProxy__Clusters__catalog__Destinations__primary__Address
          value: http://catalog:8080
        - name: ServiceUrls__catalog
          value: http://catalog:8080
        - name: ReverseProxy__Clusters__lending__Destinations__primary__Address
          value: http://lending:8080
        - name: ServiceUrls__lending
          value: http://lending:8080
        - name: ReverseProxy__Clusters__economy__Destinations__primary__Address
          value: http://economy:8080
        - name: ServiceUrls__economy
          value: http://economy:8080
        - name: ReverseProxy__Clusters__reputation__Destinations__primary__Address
          value: http://reputation:8080
        - name: ServiceUrls__reputation
          value: http://reputation:8080
        - name: ReverseProxy__Clusters__notifications__Destinations__primary__Address
          value: http://notifications:8080
        - name: ServiceUrls__notifications
          value: http://notifications:8080
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: burmalda
  labels:
    app.kubernetes.io/part-of: burmalda
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: burmalda
    spec:
      containers:
      - name: web
        image: burmalda-web:lr9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        env:
        - name: LEARNING_LABS
          value: 'false'
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      terminationGracePeriodSeconds: 30
      volumes:
      - name: nginx
        configMap:
          name: web-nginx
